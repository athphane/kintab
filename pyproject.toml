[project]
name = "kintab"
version = "0.1.0"
description = "Shared household tabs for Telegram"
requires-python = ">=3.12"
dependencies = [
    "kurigram>=2.2.26,<3",
    "TgCrypto-pyrofork>=1.2.8,<2",
    "aiohttp>=3.10,<4",
    "aiosqlite>=0.20,<1",
    "pillow>=11,<14",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-aiohttp>=1,<2",
    "ruff>=0.11,<1",
    "playwright>=1.58,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

