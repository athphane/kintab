<!doctype html>
<html lang="en">

<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>

  <div class="shell">
    <header><a class="brand" href="#home"><span class="brand-mark">k.</span> KinTab</a><div class="household-label"><span class="household-dot"></span><span id="group-title">SHARED, SETTLED.</span></div></header>
    <main id="app" aria-live="polite"><div class="empty"><div class="loader"></div><h1>Getting your tab…</h1></div></main>
    <nav aria-label="Main navigation">
      <a href="#home" data-page="home"><span><svg class="icon" aria-hidden="true"><use href="#icon-home"/></svg></span>Overview</a>
      <a href="#history" data-page="history"><span><svg class="icon" aria-hidden="true"><use href="#icon-history"/></svg></span>History</a>
      <a href="#expense" data-page="expense" class="add-nav"><span><svg class="icon" aria-hidden="true"><use href="#icon-plus"/></svg></span>Add expense</a>
      <a href="#summary" data-page="summary"><span><svg class="icon" aria-hidden="true"><use href="#icon-chart"/></svg></span>Monthly</a>
      <a href="#group" data-page="group"><span><svg class="icon" aria-hidden="true"><use href="#icon-group"/></svg></span>Group</a>
